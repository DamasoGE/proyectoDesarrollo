plugins {
  id 'application'
  id 'org.openjfx.javafxplugin' version '0.1.0' //Plugin que ayuda a construir proyectos JAVAFX
}

repositories {
	mavenCentral()
}

javafx {
    version = "25"
    modules = [ 'javafx.base', 'javafx.swing', 'javafx.graphics', 'javafx.controls', 'javafx.fxml', 'javafx.media','javafx.web']
}

dependencies {
  implementation("com.mysql:mysql-connector-j:9.5.0")
  implementation ("net.sf.jasperreports:jasperreports:7.0.6")
  implementation ("net.sf.jasperreports:jasperreports-pdf:7.0.6")
  implementation ("net.sf.jasperreports:jasperreports-charts:7.0.6")
  implementation("net.sf.jasperreports:jasperreports-fonts:7.0.6")
}

java { //Se indica la versión de JDK que ha de utilizar
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

application { //Definimos clase principal del proyecto
    mainClass = 'proyectoDesarrollo.Main'
    applicationDefaultJvmArgs = ["--enable-native-access=javafx.graphics"]
}

sourceSets {
  main {
    resources {
        srcDirs = ["src/main/resources"]
        includes = ["**/*.fxml", "**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.gif", "**/*.css","**/*.jasper"]
    }
  }
}

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}




